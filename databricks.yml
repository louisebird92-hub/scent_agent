bundle:
  name: scent-finder

sync:
  include:
    - .build

artifacts:
  default:
    build: apx build

resources:
  apps:
    scent-finder-app:
      name: "scent-finder"
      description: "Scent Finder: fragrance wardrobe, scent DNA and a perfumery guide (Lakebase + Opus 5.5)"
      source_code_path: ./.build
      resources:
        - name: postgres
          description: "Scent Finder Lakebase (fragrances, my_collection, wear_log)"
          postgres:
            branch: projects/scent-finder/branches/production
            database: projects/scent-finder/branches/production/databases/databricks-postgres
            permission: CAN_CONNECT_AND_CREATE

targets:
  dev:
    mode: development
    default: true
